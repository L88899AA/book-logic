name: runtime
on: [push, pull_request]
jobs:
  base:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: python -W error::ResourceWarning -m unittest discover -s tests -p 'test_runtime*.py' -v
      - run: python examples/replay.py --library .cache/demo-library
      - run: python tools/evaluate.py --library .cache/demo-library
      - run: python -m build
      - run: python tools/check_distribution.py dist
      - run: python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"
      - run: python -m pip install numpy
      - run: python -m unittest discover -s tests -p 'test_runtime_semantic.py' -v
